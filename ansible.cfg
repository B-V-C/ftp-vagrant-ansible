[defaults]
# Inventario por defecto, para no tener que poner -i inventory.yml en cada comando
inventory = inventory.yml

# Usuario SSH con el que Ansible entra en las máquinas (el mismo que usa Vagrant)
remote_user = vagrant

# No comprobar la identidad del servidor SSH la primera vez que nos conectamos.
# Solo para esta práctica: en producción no se debe desactivar.
# No tiene nada que ver con los certificados TLS.
host_key_checking = False

# Detectar solo el Python de las máquinas sin mostrar avisos
interpreter_python = auto_silent

# La clave privada no va aquí porque cada máquina tiene la suya:
# se indica en inventory.yml. Es la clave que genera Vagrant, solo
# vale para pruebas y no se sube al repositorio (.gitignore).