# Modo independiente IPv4.
# vsftpd se ejecuta como un servicio propio (no lo arranca inetd)
listen=YES
# No escuchar en IPv6
listen_ipv6=NO

# Acceso exclusivamente autenticado con cuentas locales.
# Sin acceso anónimo
anonymous_enable=NO
# Pueden entrar los usuarios locales del sistema (juan y ana)
local_enable=YES
# Permite subir, borrar y crear ficheros
write_enable=YES
# Autenticación con el fichero de PAM de vsftpd que trae Debian
pam_service_name=vsftpd

# Archivos nuevos: 0666 menos máscara 0002 = 0664, legibles por Apache.
local_umask=002
file_open_mode=0666

# Mensajes y registros.
dirmessage_enable=YES
use_localtime=YES
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# Enjaular a los usuarios en su home por defecto excepto ana
allow_writeable_chroot=YES
# allow_writeable_chroot: por seguridad, vsftpd no deja enjaular a un usuario
# en una carpeta en la que pueda escribir (da el error "refusing to run with
# writable root inside chroot()"). Con YES lo permite, porque el home de juan
# es suyo y puede escribir en él.
# Enjaula a todos los usuarios locales en su carpeta personal
chroot_local_user=YES
# Los usuarios de la lista son la excepción: no se enjaulan (ana)
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd.chroot_list
# Carpeta vacía que usa vsftpd internamente para aislar procesos
secure_chroot_dir=/var/run/vsftpd/empty

# FTP explícito sobre TLS, sin SSL obsoleto.
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH
# Desactivar las versiones antiguas de SSL
ssl_sslv2=NO
ssl_sslv3=NO

# Cerfificados y clave privada
# Los genera el playbook ftp.yml en /etc/ssl/ftp
rsa_cert_file=/etc/ssl/ftp/borja.test.crt
rsa_private_key_file=/etc/ssl/ftp/borja.test.key

# Rango pasivo para clientes detrás de NAT o cortafuegos.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.57.7